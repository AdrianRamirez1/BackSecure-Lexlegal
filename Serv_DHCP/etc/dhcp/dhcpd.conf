option domain-name "lex.local";
option domain-name-servers 172.16.10.30;
#DNS = controlador de dominio SRVLEX (lex.local)

default-lease-time 3600;
max-lease-time 7200;
ddns-update-style none;
subnet 172.16.10.0 netmask 255.255.255.0 {
}

#VLAN 20 OFICINA ABOGADOS JUNIORS
subnet 172.16.20.0 netmask 255.255.255.0 {
  range 172.16.20.100 172.16.20.200;
  option routers 172.16.20.1;
  option broadcast-address 172.16.20.255;
}

#VLAN 30 OFICINA ABOGADOS SENIORS
subnet 172.16.30.0 netmask 255.255.255.0 {
  range 172.16.30.100 172.16.30.200;
  option routers 172.16.30.1;
  option broadcast-address 172.16.30.255;
}

#HOST DE RESERVA (EQUIPOS CRITICOS)
#host pc-socio {
#  hardware ethernet 08:00:07:26:c0:a5;
# fixed-address 172.16.30.50;
#}
